<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#16232d">
  <title>도망쳐, 꼬물이!</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header id="hud">
      <div class="hud-item">
        <span class="label">시간</span>
        <span id="hud-time" class="value">0.0</span>
      </div>
      <div class="hud-item main">
        <span class="label">점수</span>
        <span id="hud-score" class="value">0</span>
      </div>
      <div class="hud-item">
        <span class="label">최고</span>
        <span id="hud-best" class="value">0</span>
      </div>
    </header>

    <main id="stage">
      <canvas id="game"></canvas>

      <section id="screen-start" class="overlay">
        <h1>도망쳐,<br>꼬물이!</h1>
        <p class="sub">몰려오는 벌레를 피해 최대한 오래 버티세요</p>
        <button id="btn-start" class="btn" type="button">게임 시작</button>
        <ul class="howto">
          <li><b>PC</b> WASD 또는 방향키</li>
          <li><b>모바일</b> 화면 아무 곳이나 드래그</li>
          <li><span class="star">★</span> 별을 먹으면 주변 벌레가 사라져요</li>
        </ul>
      </section>

      <section id="screen-over" class="overlay hidden">
        <h2>게임 오버</h2>
        <div class="result">
          <span class="label">이번 점수</span>
          <span id="over-score" class="big">0</span>
          <span id="over-new" class="badge hidden">최고 기록!</span>
          <span id="over-detail" class="detail">생존 0.0초</span>
          <span id="over-best" class="detail">최고 기록 0</span>
        </div>
        <button id="btn-retry" class="btn" type="button">다시 시작</button>
        <p class="hint">Space / Enter 로도 다시 시작</p>
      </section>
    </main>
  </div>

  <!-- 순서 중요: 설정 → 공용 도구 → 게임 요소 → 게임 진행 → 시작 -->
  <script src="js/config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/view.js"></script>
  <script src="js/input.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/player.js"></script>
  <script src="js/enemies.js"></script>
  <script src="js/item.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
